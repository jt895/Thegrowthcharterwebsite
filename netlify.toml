[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "11.16.0"

[dev]
  command = "pnpm dev"
  targetPort = 8443
  framework = "#custom"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

# Batch 4: How We Work renamed to The Advisory Process.
[[redirects]]
  from = "/how-we-work/"
  to = "/advisory-process/"
  status = 301

[[redirects]]
  from = "/how-we-work"
  to = "/advisory-process/"
  status = 301

# Batch 5: The Growth Charter renamed to The Growth Program.
# Umbrella page and tiers renamed: Launch Charter -> Launch,
# Launch Complete -> Grow, Charter Course -> Grow It Yourself.
[[redirects]]
  from = "/growth-charter/launch-charter/"
  to = "/growth-program/launch/"
  status = 301

[[redirects]]
  from = "/growth-charter/launch-complete/"
  to = "/growth-program/grow/"
  status = 301

[[redirects]]
  from = "/growth-charter/charter-course/"
  to = "/growth-program/grow-it-yourself/"
  status = 301

[[redirects]]
  from = "/growth-charter/do-it-together/"
  to = "/growth-program/do-it-together/"
  status = 301

[[redirects]]
  from = "/growth-charter/"
  to = "/growth-program/"
  status = 301

[[redirects]]
  from = "/growth-charter"
  to = "/growth-program/"
  status = 301

# Catch-all for any old growth-charter sub-paths not listed above.
[[redirects]]
  from = "/growth-charter/*"
  to = "/growth-program/:splat"
  status = 301

